<script>
  (function(){
    const ns = (shared) => shared ? "vpz_shared__" : "vpz_user__";
    window.storage = {
      get: function(key, shared){
        return new Promise(function(resolve, reject){
          try{
            const raw = localStorage.getItem(ns(shared)+key);
            if(raw === null){ reject(new Error("key not found")); return; }
            resolve({ key: key, value: raw, shared: !!shared });
          }catch(e){ reject(e); }
        });
      },
      set: function(key, value, shared){
        return new Promise(function(resolve, reject){
          try{
            localStorage.setItem(ns(shared)+key, value);
            resolve({ key: key, value: value, shared: !!shared });
          }catch(e){ reject(e); }
        });
      },
      delete: function(key, shared){
        return new Promise(function(resolve){
          localStorage.removeItem(ns(shared)+key);
          resolve({ key: key, deleted: true, shared: !!shared });
        });
      },
      list: function(prefix, shared){
        return new Promise(function(resolve){
          const p = ns(shared) + (prefix||"");
          const keys = [];
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            if(k.indexOf(p)===0) keys.push(k.slice(ns(shared).length));
          }
          resolve({ keys: keys, prefix: prefix, shared: !!shared });
        });
      }
    };
  })();
</script>

<script>
/* ===================================================================
   Brain XP — Native bridge integration (Android/Capacitor)
   Added: AdMob (banner + interstitial), hardware back button,
   safe-area inset diagnostics, global error logging.
   Everything here is defensive: if window.Capacitor / a plugin isn't
   present (e.g. testing in a desktop browser), it logs once and no-ops
   instead of throwing.
=================================================================== */
(function () {
  var TAG = '[BrainXP:Native]';
  function log(){ var a=['[log]'].concat([].slice.call(arguments)); console.log.apply(console, [TAG].concat(a)); }
  function warn(){ var a=[].slice.call(arguments); console.warn.apply(console, [TAG,'[warn]'].concat(a)); }
  function err(){ var a=[].slice.call(arguments); console.error.apply(console, [TAG,'[error]'].concat(a)); }

  // Global crash/error visibility — required so ad/UI failures are diagnosable
  // via `adb logcat` or chrome://inspect remote debugging.
  window.addEventListener('error', function (e) {
    err('window.onerror:', e.message, 'at', e.filename + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    err('unhandledrejection:', e.reason);
  });

  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  log('Capacitor native platform:', isNative, '— platform:', window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform());

  var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};

  /* -----------------------------------------------------------------
     1) Hardware back button
     The app already drives its own screen stack via History API
     (pushState/popstate). Capacitor's default behavior for the
     hardware back button is exactly `history.back()` when possible,
     otherwise exit — we just make that explicit here so it's logged
     and easy to verify, without changing the app's own navigation
     logic at all.
  ----------------------------------------------------------------- */
  if (isNative && Plugins.App) {
    Plugins.App.addListener('backButton', function (evt) {
      log('Hardware back pressed. history.length =', window.history.length, 'canGoBack =', evt && evt.canGoBack);
      if (window.history.length > 1) {
        window.history.back();
      } else {
        log('At root screen — exiting app.');
        Plugins.App.exitApp();
      }
    }).then(function () {
      log('Back button handler registered.');
    }).catch(function (e) { warn('Could not register back button handler:', e); });
  } else if (isNative) {
    warn('@capacitor/app plugin not found — hardware back button will fall back to default WebView behavior.');
  }

  /* -----------------------------------------------------------------
     2) Safe-area inset diagnostics
     The actual inset values are injected as CSS custom properties
     (--safe-area-inset-top/right/bottom/left) by MainActivity.java
     via evaluateJavascript(). This block only logs what arrived, so
     you can confirm injection is working from remote debugging.
  ----------------------------------------------------------------- */
  function logInsets() {
    var cs = getComputedStyle(document.documentElement);
    log('Safe-area insets now:',
      'top=' + cs.getPropertyValue('--safe-area-inset-top').trim(),
      'right=' + cs.getPropertyValue('--safe-area-inset-right').trim(),
      'bottom=' + cs.getPropertyValue('--safe-area-inset-bottom').trim(),
      'left=' + cs.getPropertyValue('--safe-area-inset-left').trim());
  }
  window.addEventListener('load', function(){ setTimeout(logInsets, 500); });

  /* -----------------------------------------------------------------
     3) AdMob — banner + interstitial
     Real ad unit IDs (yours, from AdMob console). No test/placeholder
     IDs are used. Requires @capacitor-community/admob to be installed
     and `npx cap sync android` to have been run — see README.
  ----------------------------------------------------------------- */
  var BANNER_AD_ID = 'ca-app-pub-5882771695044601/6068226610';
  var INTERSTITIAL_AD_ID = 'ca-app-pub-5882771695044601/5814065420';
  var interstitialReady = false;
  var homeNavCount = 0;

  function getAdMob() {
    if (!isNative) return null;
    if (!Plugins.AdMob) {
      warn('AdMob plugin not found on window.Capacitor.Plugins.',
           'This means @capacitor-community/admob is not installed/synced.',
           'Run: npm install @capacitor-community/admob && npx cap sync android');
      return null;
    }
    return Plugins.AdMob;
  }

  function prepareInterstitial(AdMob) {
    AdMob.prepareInterstitial({ adId: INTERSTITIAL_AD_ID }).catch(function (e) {
      warn('prepareInterstitial() failed:', e);
    });
  }

  function initAds() {
    var AdMob = getAdMob();
    if (!AdMob) return;

    AdMob.addListener('bannerAdLoaded', function () { log('Banner ad loaded.'); });
    AdMob.addListener('bannerAdFailedToLoad', function (e) { warn('Banner ad FAILED to load:', e); });
    AdMob.addListener('bannerAdSizeChanged', function (size) {
      var h = (size && size.height) ? size.height : 50;
      log('Banner size changed, reserving', h, 'px at bottom of layout.');
      document.documentElement.style.setProperty('--ad-banner-height', h + 'px');
    });

    AdMob.addListener('interstitialAdLoaded', function () { interstitialReady = true; log('Interstitial loaded and ready.'); });
    AdMob.addListener('interstitialAdFailedToLoad', function (e) { interstitialReady = false; warn('Interstitial FAILED to load:', e); });
    AdMob.addListener('interstitialAdFailedToShow', function (e) { interstitialReady = false; warn('Interstitial FAILED to show:', e); prepareInterstitial(AdMob); });
    AdMob.addListener('interstitialAdDismissed', function () { interstitialReady = false; log('Interstitial dismissed, pre-loading next.'); prepareInterstitial(AdMob); });

    AdMob.initialize({ initializeForTesting: false })
      .then(function () {
        log('AdMob SDK initialized.');
        return AdMob.requestConsentInfo();
      })
      .then(function (info) {
        log('Consent status:', info && info.status);
        if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') {
          return AdMob.showConsentForm().then(function (r) { return r; });
        }
        return info;
      })
      .then(function (info) {
        if (info && info.canRequestAds === false) {
          warn('User has not granted ad consent — skipping ad requests.');
          return;
        }
        return AdMob.showBanner({
          adId: BANNER_AD_ID,
          adSize: 'ADAPTIVE_BANNER',
          position: 'BOTTOM_CENTER',
          margin: 0,
        }).then(function () {
          log('showBanner() called.');
          prepareInterstitial(AdMob);
        });
      })
      .catch(function (e) {
        err('AdMob setup failed — ads will not show. Reason:', e);
      });
  }

  // Call manually, or wired below to fire on "← Home" navigation (a natural
  // break point) every 3rd time, so it's never shown mid-gameplay.
  window.BrainXPAds = {
    maybeShowInterstitial: function (everyN) {
      everyN = everyN || 3;
      homeNavCount++;
      var AdMob = getAdMob();
      if (!AdMob) return;
      if (!interstitialReady) { log('Interstitial not ready yet, skipping this time.'); return; }
      if (homeNavCount % everyN !== 0) { log('Skipping interstitial (shown every', everyN, 'exits; count=', homeNavCount, ')'); return; }
      AdMob.showInterstitial().catch(function (e) { warn('showInterstitial() failed:', e); });
    }
  };

  // Non-invasive hook: observe clicks on the existing "← Home" header
  // button via delegation (does not modify the app's own code/state).
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (b && /Home/.test(b.textContent) && b.textContent.indexOf('\u2190') !== -1) {
      window.BrainXPAds.maybeShowInterstitial(3);
    }
  }, true);

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initAds();
  } else {
    document.addEventListener('DOMContentLoaded', initAds);
  }
})();
</script>

<script>
/* ===================================================================
   Brain XP — Unique polish pass
   Screen transitions, subtle navigation sound (reusing the app's own
   existing sound bank + mute setting), enhanced press feedback, and a
   couple of hidden VPlayZone easter eggs. Everything here is additive
   and observes/delegates rather than touching app state directly.
=================================================================== */
(function () {
  var TAG = '[BrainXP:Polish]';
  function log(){ console.log.apply(console, [TAG].concat([].slice.call(arguments))); }

  /* -----------------------------------------------------------------
     1) Smooth screen transitions
     Verified: #root's direct child is replaced (not mutated in place)
     exactly on top-level screen navigation, and never during normal
     gameplay interaction (confirmed empirically — card flips/timers
     don't trigger this). Safe to animate every such swap generically.
  ----------------------------------------------------------------- */
  var style = document.createElement('style');
  style.textContent = [
    '@keyframes bxp-screen-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}',
    '.bxp-screen-anim{animation:bxp-screen-in .32s cubic-bezier(.2,.8,.2,1) both;}',
    /* Slightly stronger, consistent press feedback layered on top of
       the existing scale/shadow treatment already in the app. */
    '.gc:active, .qc:active, button:not(:disabled):active{filter:brightness(1.12);}',
  ].join('\n');
  document.head.appendChild(style);

  function wireScreenTransitions() {
    var root = document.getElementById('root');
    if (!root) return;
    var mo = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        if (m.type !== 'childList') return;
        m.addedNodes.forEach(function (node) {
          if (node.nodeType === 1 && node.parentElement === root) {
            node.classList.add('bxp-screen-anim');
            node.addEventListener('animationend', function () {
              node.classList.remove('bxp-screen-anim');
            }, { once: true });
          }
        });
      });
    });
    mo.observe(root, { childList: true });
    log('Screen transition observer attached.');
  }

  /* -----------------------------------------------------------------
     2) Subtle navigation sound
     Reuses the app's OWN sound bank + mute setting (exposed as
     window.__bxpSound / window.__bxpMutedRef in index.html) instead of
     building a parallel audio system. Scoped only to Home-screen cards
     (.gc/.qc), which were confirmed to have no existing sound wired —
     avoids double-triggering sounds on buttons that already have their
     own game-specific effects.
  ----------------------------------------------------------------- */
  function wireNavSound() {
    document.addEventListener('click', function (e) {
      var card = e.target.closest && e.target.closest('.gc, .qc');
      if (!card) return;
      var snd = window.__bxpSound;
      if (snd && typeof snd.click === 'function') {
        try { snd.click(); } catch (err) { /* ignore */ }
      }
    }, true);
    log('Home card navigation sound wired (respects existing mute setting).');
  }

  /* -----------------------------------------------------------------
     3) Easter egg — tap the home screen's decorative brain icon 5x
     quickly. This element (data-bxp-egg-trigger) is purely decorative
     with no existing onClick handler, so this can't interfere with or
     get blocked by any real feature (verified — the avatar icon was
     considered first but rejected because it already opens the
     profile on tap, which would swallow the rapid-tap sequence).
  ----------------------------------------------------------------- */
  function wireAvatarEasterEgg() {
    var taps = [];
    document.addEventListener('click', function (e) {
      var avatar = e.target.closest && e.target.closest('[data-bxp-egg-trigger]');
      if (!avatar) return;
      var now = Date.now();
      taps.push(now);
      taps = taps.filter(function (t) { return now - t < 2500; });
      if (taps.length >= 5) {
        taps = [];
        showEasterEgg();
      }
    }, true);
  }

  function showEasterEgg() {
    if (document.getElementById('bxp-egg-root')) return;
    try { window.__bxpSound && window.__bxpSound.unlock && window.__bxpSound.unlock(); } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([10, 40, 10]); } catch (e) {}

    var wrap = document.createElement('div');
    wrap.id = 'bxp-egg-root';
    wrap.innerHTML = [
      '<style>',
      '#bxp-egg-root{position:fixed;inset:0;z-index:99998;background:rgba(5,5,16,0.92);',
      'display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;',
      'font-family:"Roboto Mono","Courier New",monospace;animation:bxp-egg-fade .25s ease;}',
      '@keyframes bxp-egg-fade{from{opacity:0}to{opacity:1}}',
      '#bxp-egg-card{max-width:340px;width:100%;border:1px solid rgba(0,255,156,0.4);border-radius:10px;',
      'background:#07071a;padding:22px 20px;box-shadow:0 0 30px rgba(0,255,156,0.25),0 0 60px rgba(0,212,255,0.15);',
      'color:#7fe9c9;font-size:13px;line-height:1.7;text-align:center;}',
      '#bxp-egg-card .bxp-egg-title{color:#eafff5;font-weight:800;letter-spacing:.12em;font-size:15px;',
      'text-shadow:0 0 10px rgba(0,255,156,0.7);margin-bottom:4px;}',
      '#bxp-egg-card .bxp-egg-rule{color:#00FF9C;opacity:.5;margin-bottom:12px;}',
      '#bxp-egg-card .bxp-egg-close{margin-top:16px;display:inline-block;border:1px solid rgba(127,233,201,0.4);',
      'border-radius:6px;padding:6px 16px;color:#7fe9c9;opacity:.8;font-size:11px;letter-spacing:.08em;}',
      '</style>',
      '<div id="bxp-egg-card">',
      '<div class="bxp-egg-title">VPLAYZONE DEV CONSOLE</div>',
      '<div class="bxp-egg-rule">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</div>',
      '<div>You found a secret tap combo. \u{1F9E0}\u26A1</div>',
      '<div style="margin-top:10px;">BrainXP is built solo, one commit<br/>at a time, by VPlayZone.</div>',
      '<div style="margin-top:10px;">Thanks for training your brain<br/>with us — now get back to it!</div>',
      '<div class="bxp-egg-close">tap anywhere to close</div>',
      '</div>'
    ].join('');
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function () {
      wrap.style.transition = 'opacity .2s ease';
      wrap.style.opacity = '0';
      setTimeout(function () { wrap.remove(); }, 200);
    });
    log('Easter egg triggered.');
  }

  /* -----------------------------------------------------------------
     4) Daily login reward — separate from Daily Workout (which needs
     actual gameplay). Just opening the app on a new day grants a small
     reward, escalating with consecutive days, capped at 50 coins.
     Computed directly against localStorage so it's ready before React
     reads the profile (avoids any state sync issues), then shown via a
     dismissible overlay once the boot sequence is done.
  ----------------------------------------------------------------- */
  var bxpPendingLoginReward = null;
  function computeLoginReward() {
    try {
      var raw = localStorage.getItem('vpz_user__profile');
      if (!raw) return; // brand new user — onboarding handles first run
      var profile = JSON.parse(raw);
      var today = new Date().toISOString().slice(0, 10);
      if (profile.lastLoginRewardDate === today) return; // already claimed
      var y = new Date(); y.setDate(y.getDate() - 1);
      var yStr = y.toISOString().slice(0, 10);
      var newStreak = (profile.loginStreak && profile.lastLoginRewardDate === yStr) ? profile.loginStreak + 1 : 1;
      var coins = Math.min(50, 10 + (newStreak - 1) * 3);
      var xp = 10;
      profile.coins = (profile.coins || 0) + coins;
      profile.xp = (profile.xp || 0) + xp;
      profile.loginStreak = newStreak;
      profile.lastLoginRewardDate = today;
      localStorage.setItem('vpz_user__profile', JSON.stringify(profile));
      bxpPendingLoginReward = { coins: coins, xp: xp, streak: newStreak };
      log('Daily login reward granted:', bxpPendingLoginReward);
    } catch (e) { warn('Login reward check failed:', e); }
  }

  function showLoginRewardModal() {
    if (!bxpPendingLoginReward || document.getElementById('bxp-login-root')) return;
    var r = bxpPendingLoginReward;
    var wrap = document.createElement('div');
    wrap.id = 'bxp-login-root';
    wrap.innerHTML = [
      '<style>',
      '#bxp-login-root{position:fixed;inset:0;z-index:99997;background:rgba(5,5,16,0.88);',
      'display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;',
      'font-family:"Segoe UI",system-ui,sans-serif;animation:bxp-login-fade .25s ease;}',
      '@keyframes bxp-login-fade{from{opacity:0}to{opacity:1}}',
      '#bxp-login-card{max-width:320px;width:100%;border-radius:18px;background:linear-gradient(160deg,#151530,#0a0a1e);',
      'border:1px solid rgba(123,47,255,0.4);padding:26px 22px;text-align:center;',
      'box-shadow:0 0 40px rgba(123,47,255,0.25);}',
      '#bxp-login-card .bxp-lr-icon{font-size:44px;margin-bottom:8px;}',
      '#bxp-login-card .bxp-lr-title{color:#fff;font-weight:800;font-size:18px;margin-bottom:4px;}',
      '#bxp-login-card .bxp-lr-streak{color:#00D4FF;font-size:12px;margin-bottom:16px;font-weight:600;}',
      '#bxp-login-card .bxp-lr-rewards{display:flex;gap:12px;justify-content:center;margin-bottom:18px;}',
      '#bxp-login-card .bxp-lr-pill{background:rgba(255,255,255,0.06);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;color:#fff;}',
      '#bxp-login-card .bxp-lr-close{display:inline-block;padding:10px 28px;border-radius:10px;',
      'background:linear-gradient(135deg,#7B2FFF,#5010CC);color:#fff;font-weight:700;font-size:13px;}',
      '</style>',
      '<div id="bxp-login-card">',
      '<div class="bxp-lr-icon">\u{1F381}</div>',
      '<div class="bxp-lr-title">Daily Login Bonus!</div>',
      '<div class="bxp-lr-streak">\u{1F525} ' + r.streak + '-day streak</div>',
      '<div class="bxp-lr-rewards">',
      '<div class="bxp-lr-pill">+' + r.xp + ' XP</div>',
      '<div class="bxp-lr-pill">\u{1FA99} +' + r.coins + '</div>',
      '</div>',
      '<div class="bxp-lr-close">Claim</div>',
      '</div>'
    ].join('');
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function () {
      wrap.style.transition = 'opacity .2s ease';
      wrap.style.opacity = '0';
      setTimeout(function () { wrap.remove(); location.reload(); }, 200);
    });
  }

  function init() {
    wireScreenTransitions();
    wireNavSound();
    wireAvatarEasterEgg();
    if (false) {
      setTimeout(showLoginRewardModal, 3600); // wait out the boot sequence
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }
})();
</script>

<script>
(function(){
  var B=window.BXP;
  document.title=B.name+' \u2014 Made with BrainXP | Vplayzone';
  if(B.logo){var l=document.createElement('link');l.rel='icon';l.href=B.logo;document.head.appendChild(l);}
  function logo(){return B.logo?'<img src="'+B.logo+'" alt="">':B.icon;}
  var badge=document.createElement('div');badge.id='bxp-badge';
  badge.innerHTML='<span>\u{1F9E0} Made with <b>BrainXP</b> \u00B7 by Vplayzone</span>';
  var end=document.createElement('div');end.id='bxp-end';
  end.innerHTML='<div class="card"><div class="lg">'+logo()+'</div><h2>Thanks for playing '+B.name+'!</h2><p>'+B.message+'</p>'+
    '<button class="btn p" id="bxp-again">\u25B6 Play again</button>'+
    '<button class="btn" id="bxp-back">\u2190 Back to game</button>'+
    '<small>Made with BrainXP \u00B7 by Vplayzone</small></div>';
  function mount(){document.body.appendChild(badge);document.body.appendChild(end);
    document.getElementById('bxp-again').onclick=function(){location.reload();};
    document.getElementById('bxp-back').onclick=function(){end.style.display='none';};}
  if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount);
  window.__bxpReady=function(){badge.style.display='flex';};
  window.__bxpEnd=function(){end.style.display='flex';};
})();
</script>
